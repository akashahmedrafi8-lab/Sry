<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Samiya ❤️</title>
    <!-- Google Fonts for Luxury Look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a0011 0%, #050005 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Ambient Background Lighting Effects */
        .light-beam {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 75, 110, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: moveLight 8s infinite alternate ease-in-out;
        }

        .light-beam:nth-child(2) {
            background: rgba(140, 50, 255, 0.15);
            right: 10%;
            bottom: 10%;
            animation-delay: -4s;
        }

        @keyframes moveLight {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* Falling Text / Heart Rain Style */
        .rain-item {
            position: absolute;
            top: -60px;
            color: rgba(255, 105, 150, 0.75);
            font-size: 16px;
            font-weight: 600;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            text-shadow: 0 0 12px rgba(255, 75, 110, 0.9);
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(15deg);
                opacity: 0;
            }
        }

        /* Premium Glassmorphism Card Container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 35px 25px;
            background: rgba(20, 10, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 105, 150, 0.3);
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(255, 75, 110, 0.3), inset 0 0 25px rgba(255, 75, 110, 0.15);
            max-width: 420px;
            width: 90%;
            animation: containerGlow 4s infinite alternate;
        }

        @keyframes containerGlow {
            0% {
                box-shadow: 0 0 25px rgba(255, 75, 110, 0.25), inset 0 0 15px rgba(255, 75, 110, 0.1);
                border-color: rgba(255, 75, 110, 0.2);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 75, 110, 0.6), inset 0 0 30px rgba(255, 75, 110, 0.3);
                border-color: rgba(255, 105, 150, 0.6);
            }
        }

        /* Gorgeous Profile Image Frame with Rotating Neon Ring */
        .profile-img-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ff2a5f, #ff7eb3, #9b51e0, #ff2a5f);
            background-size: 300% 300%;
            animation: gradientRotate 5s linear infinite, floatImage 3s ease-in-out infinite alternate;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #11050c;
        }

        @keyframes gradientRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatImage {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* Stylized Name */
        h1.name {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 42px;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px #ff4b6e, 0 0 20px #ff4b6e, 0 0 40px #ff1a48;
            animation: nameGlow 2.5s infinite alternate;
        }

        @keyframes nameGlow {
            0% { text-shadow: 0 0 10px #ff4b6e, 0 0 20px #ff4b6e; transform: scale(1); }
            100% { text-shadow: 0 0 20px #ff7eb3, 0 0 40px #ff4b6e, 0 0 60px #ff1a48; transform: scale(1.03); }
        }

        /* Romantic Subtitle */
        .subtitle {
            color: #ffb3c6;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        /* Professional & Heartfelt Sorry Message */
        .sorry-msg {
            color: #fce4ec;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 400;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInText 2s ease forwards;
            animation-delay: 1.2s;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Background Light Beams -->
    <div class="light-beam" style="top: 10%; left: 15%;"></div>
    <div class="light-beam"></div>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Profile Image Wrapper -->
        <div class="profile-img-box">
            <img src="IMG-20260627-WA0011.jpg" alt="Samiya" class="profile-img">[span_0](start_span)[span_0](end_span)
        </div>

        <!-- Name -->
        <h1 class="name">Samiya</h1>
        <div class="subtitle">My Special Universe ✨</div>

        <!-- Sorry & Love Message -->
        <div class="sorry-msg">
            I am truly and deeply sorry for my mistake. You mean everything to me, and my world feels incomplete without your smile. Please forgive me. ❤️
        </div>
    </div>

    <!-- JavaScript for Dynamic Falling "I Love You" & Hearts -->
    <script>
        function createRainEffect() {
            const items = ["I Love You ❤️", "Samiya ✨", "I'm So Sorry 🥺", "💖", "I Love You 💫", "❤️"];
            const rainItem = document.createElement('div');
            rainItem.classList.add('rain-item');
            
            // Random text / heart selection
            rainItem.innerText = items[Math.floor(Math.random() * items.length)];
            
            // Random horizontal positioning
            rainItem.style.left = Math.random() * window.innerWidth + 'px';
            
            // Random animation speed (duration between 3.5 to 7 seconds)
            const duration = Math.random() * 3.5 + 3.5;
            rainItem.style.animationDuration = duration + 's';
            
            // Random sizing for dynamic look
            rainItem.style.fontSize = (Math.random() * 8 + 14) + 'px';

            document.body.appendChild(rainItem);

            // Clean up elements after falling to preserve device memory
            setTimeout(() => {
                rainItem.remove();
            }, duration * 1000);
        }

        // Generate falling items continuously every 120 milliseconds
        setInterval(createRainEffect, 120);
    </script>
</body>
</html>
